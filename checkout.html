<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Aura Vitalité</title>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    body { background-color: var(--color-midnight); }
    .checkout-container {
      max-width: 900px;
      margin: 3rem auto;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 2rem;
      padding: 0 1rem;
    }
    .checkout-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
      color: #333;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      background: rgba(255,255,255,0.8);
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--color-indigo);
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
    }
    .checkout-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-silver);
      font-size: 1.5rem;
      font-weight: 600;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 768px) {
      .checkout-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="starry-bg">

  <header style="padding: 1.5rem 0; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05); background: white;">
    <a href="/" style="font-family: var(--font-serif); font-size: 1.5rem; font-weight: 600; color: var(--color-indigo); text-decoration: none;">AURA VITALITÉ</a>
  </header>

  <div class="container">
    <div class="checkout-container">
      
      <!-- Formulaire -->
      <div class="checkout-panel gsap-reveal">
        <h2 style="font-family: var(--font-serif); font-size: 1.8rem; margin-bottom: 2rem;">Informations de livraison</h2>
        
        <div class="grid-2">
          <div class="form-group">
            <label for="firstname">Prénom</label>
            <input type="text" id="firstname" placeholder="Jean" required />
          </div>
          <div class="form-group">
            <label for="lastname">Nom</label>
            <input type="text" id="lastname" placeholder="Dupont" required />
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="jean.dupont@email.com" required />
        </div>
        
        <div class="form-group">
          <label for="address">Adresse</label>
          <input type="text" id="address" placeholder="123 Avenue des Champs-Élysées" required />
        </div>
        
        <div class="grid-2">
          <div class="form-group">
            <label for="zip">Code Postal</label>
            <input type="text" id="zip" placeholder="75008" required />
          </div>
          <div class="form-group">
            <label for="city">Ville</label>
            <input type="text" id="city" placeholder="Paris" required />
          </div>
        </div>
        
        <h2 style="font-family: var(--font-serif); font-size: 1.6rem; margin: 2rem 0 1.5rem 0;">Paiement Sécurisé</h2>
        
        <div class="form-group" style="position: relative;">
          <label for="card">Numéro de carte</label>
          <input type="text" id="card" placeholder="**** **** **** ****" required />
          <div style="position: absolute; right: 1rem; top: 2.5rem; color: var(--color-silver);">💳</div>
        </div>
        
        <div class="grid-2">
          <div class="form-group">
            <label for="exp">Expiration (MM/AA)</label>
            <input type="text" id="exp" placeholder="12/26" required />
          </div>
          <div class="form-group">
            <label for="cvv">Code de sécurité (CVV)</label>
            <input type="text" id="cvv" placeholder="123" required />
          </div>
        </div>
        
      </div>
      
      <!-- Résumé -->
      <div style="position: sticky; top: 2rem;">
        <div class="checkout-panel gsap-reveal">
          <h2 style="font-family: var(--font-serif); font-size: 1.5rem; margin-bottom: 2rem;">Résumé de la commande</h2>
          
          <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
            <div style="width: 80px; height: 80px; background: rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 0.5rem;">
              <img src="/ghkfoto.png" alt="Sérum" style="max-height: 100%; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));" />
            </div>
            <div>
              <div style="font-weight: 600;">Sérum GHK-Cu Premium</div>
              <div style="color: var(--color-gray); font-size: 0.9rem;">Quantité: 1</div>
            </div>
          </div>
          
          <div class="summary-item">
            <span style="color: var(--color-gray);">Sous-total</span>
            <span>120,00 €</span>
          </div>
          <div class="summary-item">
            <span style="color: var(--color-gray);">Livraison Express (24h)</span>
            <span style="color: #2e7d32;">Offerte</span>
          </div>
          
          <div class="summary-total">
            <span>Total</span>
            <span style="color: var(--color-indigo);">120,00 €</span>
          </div>
          
          <button class="btn btn-primary" style="width: 100%; margin-top: 2rem; font-size: 1.1rem; padding: 1.25rem;">Finaliser ma commande</button>
          
          <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--color-gray); display: flex; flex-direction: column; gap: 0.5rem;">
            <div>🔒 Connexion chiffrée SSL 256-bit</div>
            <div>🛡️ Garantie satisfait ou remboursé 30 jours</div>
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    gsap.from(".gsap-reveal", {
      y: 30,
      opacity: 0,
      duration: 0.8,
      stagger: 0.2,
      ease: "power3.out"
    });
    
    // Add simple interaction for the button
    const btn = document.querySelector('.btn-primary');
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      btn.innerHTML = 'Traitement en cours...';
      btn.style.opacity = '0.8';
      setTimeout(() => {
        btn.innerHTML = 'Commande validée ! ✓';
        btn.style.background = '#2e7d32';
        btn.style.boxShadow = '0 10px 30px rgba(46, 125, 50, 0.3)';
      }, 1500);
    });
  </script>
</body>
</html>
